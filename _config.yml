title: Fagaki
url: https://fagaki.github.io
baseurl: ""

# Where https://fagaki.github.io/ sends first-time visitors. Languages: _data/languages.yml
default_language: el

# _recipes/<language>/<name>.md is published at /<language>/<name>.html
collections:
  recipes:
    output: true
    permalink: /:path.html

defaults:
  - scope:
      path: ""
      type: recipes
    values:
      layout: recipe

plugins:
  - jekyll-sitemap

exclude:
  - README.md
  - CLAUDE.md
  - TEMPLATE.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
