---
layout: null
sitemap: false
---
{%- assign default_home = "/" | append: site.default_language | append: "/" | relative_url -%}
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{ site.title }}</title>
  <link rel="canonical" href="{{ default_home | absolute_url }}">
  <script>
    // Go to the language the visitor picked before, or the default one.
    (function () {
      var languages = {{ site.data.languages | map: "code" | jsonify }};
      var lang = '{{ site.default_language }}';
      try {
        var saved = localStorage.getItem('site-lang');
        if (languages.indexOf(saved) >= 0) lang = saved;
      } catch (e) { /* storage blocked */ }
      location.replace('{{ "/" | relative_url }}' + lang + '/' + location.search);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url={{ default_home }}">
</head>
<body>
  <a href="{{ default_home }}">{{ site.title }}</a>
</body>
</html>
